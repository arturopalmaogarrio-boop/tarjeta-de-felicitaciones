<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Cumpleaños</title>
  <style>
    :root {
      --fondo: #a5b6d6;
      --tarjeta: #ffffff;
      --texto: #1e293b;
      --texto-suave: #64748b;
      --borde: #e2e8f0;
      --campo: #f8fafc;
      --primario: #4f46e5;
      --acento: #db2777;
      --exito-fondo: #ecfdf5;
      --exito-texto: #047857;
      --error-fondo: #fef2f2;
      --error-texto: #b91c1c;
      --sombra: 0 20px 45px rgba(30, 41, 90, 0.16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #0f172a;
        --tarjeta: #1e293b;
        --texto: #f1f5f9;
        --texto-suave: #94a3b8;
        --borde: #334155;
        --campo: #0f172a;
        --exito-fondo: #064e3b;
        --exito-texto: #a7f3d0;
        --error-fondo: #450a0a;
        --error-texto: #fecaca;
        --sombra: 0 20px 45px rgba(0, 0, 0, 0.45);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--fondo);
      color: var(--texto);
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .tarjeta {
      width: 100%;
      max-width: 460px;
      background: var(--tarjeta);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--sombra);
    }

    .encabezado {
      padding: 36px 32px 28px;
      text-align: center;
      color: #ffffff;
      background: linear-gradient(135deg, #1e1b4b 0%, var(--primario) 55%, var(--acento) 100%);
    }

    .encabezado .icono { font-size: 44px; line-height: 1; }
    .encabezado h1 { margin: 14px 0 6px; font-size: 24px; font-weight: 700; }
    .encabezado p { margin: 0; color: #e0e7ff; font-size: 14px; }

    form { padding: 28px 32px 32px; display: grid; gap: 18px; }

    .campo { display: grid; gap: 6px; }

    label { font-size: 13px; font-weight: 600; color: var(--texto-suave); }

    input, select {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      font-size: 15px;
      color: var(--texto);
      background: var(--campo);
      border: 1px solid var(--borde);
      border-radius: 12px;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primario);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.18);
    }

    .fila { display: grid; grid-template-columns: 1fr 2fr; gap: 14px; }

    button {
      margin-top: 6px;
      padding: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: linear-gradient(90deg, var(--primario), var(--acento));
      transition: transform .15s, opacity .15s;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .6; cursor: wait; transform: none; }

    .mensaje {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }
    .mensaje.exito { display: block; background: var(--exito-fondo); color: var(--exito-texto); }
    .mensaje.error { display: block; background: var(--error-fondo); color: var(--error-texto); }

    .pie a { color: var(--primario); font-weight: 600; text-decoration: none; }
    .pie a:hover { text-decoration: underline; }
    @media (prefers-color-scheme: dark) { .pie a { color: #a5b4fc; } }

    .pie {
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--texto-suave);
      border-top: 1px solid var(--borde);
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <header class="encabezado">
      <div class="icono">🎂</div>
      <h1>Registro de Cumpleaños</h1>
      <p>Registra a una persona para enviarle su tarjeta el día de su cumpleaños</p>
    </header>

    <form id="formulario" novalidate>
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" type="text" maxlength="100" placeholder="Ej. Ana Torres" required autocomplete="name">
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" maxlength="150" placeholder="ana@ejemplo.com" required autocomplete="email">
      </div>

      <div class="fila">
        <div class="campo">
          <label for="dia">Día</label>
          <input id="dia" name="dia" type="number" min="1" max="31" placeholder="15" required>
        </div>
        <div class="campo">
          <label for="mes">Mes</label>
          <select id="mes" name="mes" required>
            <option value="" disabled selected>Selecciona un mes</option>
            <option value="1">Enero</option>
            <option value="2">Febrero</option>
            <option value="3">Marzo</option>
            <option value="4">Abril</option>
            <option value="5">Mayo</option>
            <option value="6">Junio</option>
            <option value="7">Julio</option>
            <option value="8">Agosto</option>
            <option value="9">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
          </select>
        </div>
      </div>

      <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>

      <button id="boton" type="submit">🎉 Registrar persona</button>
    </form>

    <footer class="pie"><a href="personas.html">👥 Ver personas registradas</a></footer>
  </main>

  <script>
    // Si la página no viene del backend (doble clic en el archivo, Live Server, etc.),
    // las peticiones se envían directamente al backend en localhost:3000.
    const API = location.protocol === "file:" || location.port !== "3000" ? "http://localhost:3000" : "";
    const formulario = document.getElementById("formulario");
    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("boton");
    const diasPorMes = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

    // Ajusta el máximo del día según el mes elegido.
    document.getElementById("mes").addEventListener("change", (e) => {
      document.getElementById("dia").max = diasPorMes[Number(e.target.value) - 1];
    });

    function mostrar(tipo, texto) {
      mensaje.className = "mensaje " + tipo;
      mensaje.textContent = texto;
    }

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const datos = {
        nombre: formulario.nombre.value.trim(),
        correo: formulario.correo.value.trim(),
        dia: Number(formulario.dia.value),
        mes: Number(formulario.mes.value),
      };

      if (!datos.nombre || !formulario.correo.checkValidity() || !datos.correo) {
        mostrar("error", "Escribe un nombre y un correo electrónico válido.");
        return;
      }
      if (!datos.mes) {
        mostrar("error", "Selecciona el mes de cumpleaños.");
        return;
      }
      const maxDia = diasPorMes[datos.mes - 1];
      if (!Number.isInteger(datos.dia) || datos.dia < 1 || datos.dia > maxDia) {
        mostrar("error", `El día debe estar entre 1 y ${maxDia} para el mes elegido.`);
        return;
      }

      boton.disabled = true;
      boton.textContent = "Registrando…";

      try {
        const respuesta = await fetch(`${API}/api/personas`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos),
        });
        const cuerpo = await respuesta.json().catch(() => ({}));

        if (respuesta.ok) {
          mostrar("exito", `✅ Registro guardado: ${cuerpo.nombre}. La tarjeta se enviará cada ${cuerpo.dia}/${cuerpo.mes}.`);
          formulario.reset();
        } else {
          mostrar("error", cuerpo.mensaje || "No se pudo registrar a la persona.");
        }
      } catch {
        mostrar("error", "No se pudo conectar con el servidor. Inténtalo de nuevo.");
      } finally {
        boton.disabled = false;
        boton.textContent = "🎉 Registrar persona";
      }
    });
  </script>
</body>
</html>
